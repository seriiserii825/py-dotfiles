[project]
name = "py-dotfiles"
version = "0.1.0"
description = ""
authors = [
    {name = "serii",email = "seriiburduja@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "autopep8 (==2.3.2)",
    "flake8 (==7.3.0)",
    "markdown-it-py (==3.0.0)",
    "mccabe (==0.7.0)",
    "mdurl (==0.1.2)",
    "mypy (==1.16.1)",
    "mypy-extensions (==1.1.0)",
    "pathspec (==0.12.1)",
    "py-libs",
    "pycodestyle (==2.14.0)",
    "pyflakes (==3.4.0)",
    "pygments (==2.19.2)",
    "rich (==14.0.0)",
    "ruff>=0.17.3",
    "typing-extensions (==4.14.0)",
]

[tool.uv.workspace]
members = [
    "libs/py-libs",
]

[tool.uv.sources]
py-libs = { workspace = true, editable = true }


[tool.ruff]
line-length = 88
exclude = [
    "migrations",
    "tests",
    "docs",
    "build",
    "dist",
    "venv",
    ".venv",
    ".git",
    "__pycache__",
]
fix = true
unsafe-fixes = true
target-version = "py312"  # <- specify Python 3.12 explicitly here

[tool.ruff.lint]
select = [
    "F401",  # Unused import
    "F403",  # Wildcard import
    "F405",  # Name may be undefined, or defined from star imports
    "F841",  # Local variable is assigned to but never used
    "E501",  # Line too long
    "I",     # Import sorting (isort-compatible)
]
